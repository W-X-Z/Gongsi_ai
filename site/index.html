<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0b0f" />
<title>오늘의 주요 공시</title>
<script>window.__FEED_URL__="./feed.json";</script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0b0f;
    --bg-2: #0e1016;
    --card: #14161d;
    --card-hi: #181b24;
    --line: #232633;
    --line-2: #2c3140;
    --text: #eef1f7;
    --muted: #8b93a7;
    --muted-2: #5b6376;

    --pos: #ff5b67; --pos-bg: rgba(255,91,103,.13);
    --neg: #4d8bff; --neg-bg: rgba(77,139,255,.13);
    --neu: #9aa3b8; --neu-bg: rgba(154,163,184,.12);
    --hi: #ffc24b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(77,139,255,.10), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
      "Apple SD Gothic Neo", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -.01em;
  }
  .wrap { max-width: 500px; margin: 0 auto; min-height: 100vh; padding-bottom: 48px; }

  /* ── Header ─────────────────────────── */
  header {
    position: sticky; top: 0; z-index: 20;
    padding: 18px 18px 12px;
    background: linear-gradient(180deg, rgba(10,11,15,.96) 70%, rgba(10,11,15,0));
    backdrop-filter: blur(12px);
  }
  .head-row { display: flex; align-items: baseline; gap: 8px; }
  .title { font-size: 21px; font-weight: 800; letter-spacing: -.4px; }
  .date { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted);
    background: var(--card); border: 1px solid var(--line); padding: 4px 9px; border-radius: 999px; }

  .stats { display: flex; gap: 6px; margin-top: 13px; }
  .stat { flex: 1; display: flex; flex-direction: column; gap: 2px; align-items: center;
    padding: 9px 0; border-radius: 13px; border: 1px solid var(--line); background: var(--card); }
  .stat .n { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 11px; font-weight: 600; color: var(--muted); }
  .stat.pos .n { color: var(--pos); } .stat.neg .n { color: var(--neg); } .stat.neu .n { color: var(--neu); }

  .filters { display: flex; gap: 6px; margin-top: 11px; }
  .chip { flex: 1; padding: 9px 0; text-align: center; font-size: 13px; font-weight: 700;
    color: var(--muted); background: transparent; border: 1px solid var(--line);
    border-radius: 999px; cursor: pointer; transition: .15s; }
  .chip.on { color: #fff; background: var(--card-hi); border-color: var(--line-2); }

  /* ── Feed ───────────────────────────── */
  .feed { padding: 8px 14px 0; display: flex; flex-direction: column; gap: 11px; }

  .card {
    position: relative; background: var(--card);
    border: 1px solid var(--line); border-radius: 18px;
    padding: 15px 16px 13px; overflow: hidden;
    transition: border-color .15s, transform .15s;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px;
    width: 3px; border-radius: 3px; background: var(--accent, var(--neu)); }
  @media (hover: hover) { .card:hover { border-color: var(--line-2); transform: translateY(-1px); } }

  .top { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .metric { font-size: 12px; font-weight: 800; color: var(--accent);
    background: var(--accent-bg); padding: 4px 10px; border-radius: 8px; letter-spacing: -.2px; }
  .imp { margin-left: auto; display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 700; color: var(--muted); }
  .imp .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted-2); }
  .imp.lvl3 { color: var(--hi); } .imp.lvl3 .dot { background: var(--hi); }
  .sent { font-size: 12px; font-weight: 800; padding: 4px 11px; border-radius: 999px;
    color: var(--accent); background: var(--accent-bg); }

  .headline { font-size: 17px; font-weight: 700; line-height: 1.34; letter-spacing: -.3px; margin: 2px 0 0; }

  .meta { display: flex; align-items: center; gap: 7px; margin-top: 9px; flex-wrap: wrap; }
  .corp { font-size: 13px; font-weight: 700; }
  .ticker { font-size: 11px; font-weight: 600; color: var(--muted);
    border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; font-variant-numeric: tabular-nums; }
  .report { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.4; }

  .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
  .tag { font-size: 10.5px; font-weight: 600; color: var(--muted); border: 1px solid var(--line);
    padding: 2px 7px; border-radius: 6px; }

  .actions { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .22s ease; }
  .actions.open { grid-template-rows: 1fr; }
  .actions-in { overflow: hidden; }
  .actions ul { margin: 11px 0 2px; padding: 11px 0 0 0; border-top: 1px dashed var(--line); list-style: none; }
  .actions li { position: relative; font-size: 13px; color: #ced5e4; line-height: 1.5;
    padding-left: 16px; margin-bottom: 5px; }
  .actions li::before { content: "→"; position: absolute; left: 0; color: var(--accent); font-weight: 700; }

  .foot { display: flex; align-items: center; margin-top: 12px; }
  .toggle { font-size: 12px; font-weight: 700; color: var(--muted); background: none; border: none;
    padding: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .toggle .car { transition: transform .2s; font-size: 10px; }
  .toggle.open .car { transform: rotate(180deg); }
  .src { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); text-decoration: none; }
  .src:active { color: var(--text); }

  .state { padding: 70px 24px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .skel { height: 92px; border-radius: 18px; border: 1px solid var(--line);
    background: linear-gradient(100deg, var(--card) 30%, var(--card-hi) 50%, var(--card) 70%);
    background-size: 200% 100%; animation: sh 1.1s linear infinite; }
  @keyframes sh { to { background-position: -200% 0; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-row">
      <span class="title">오늘의 주요 공시</span>
      <span class="date" id="date">—</span>
    </div>
    <div class="stats" id="stats">
      <div class="stat pos"><span class="n" id="cPos">0</span><span class="l">호재</span></div>
      <div class="stat neg"><span class="n" id="cNeg">0</span><span class="l">악재</span></div>
      <div class="stat neu"><span class="n" id="cNeu">0</span><span class="l">중립</span></div>
    </div>
    <div class="filters" id="filters">
      <button class="chip on" data-imp="2">주요</button>
      <button class="chip" data-imp="3">중요만</button>
      <button class="chip" data-imp="1">전체</button>
    </div>
  </header>
  <div class="feed" id="feed">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>
</div>

<script>
const SENT = {
  "호재": { v: "var(--pos)", b: "var(--pos-bg)" },
  "악재": { v: "var(--neg)", b: "var(--neg-bg)" },
  "중립": { v: "var(--neu)", b: "var(--neu-bg)" },
};
const FEED_URL = window.__FEED_URL__ || "/api/feed?min_importance=1";
let minImp = 2;
let allItems = [];

const esc = s => (s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function card(it) {
  const a = it.analysis, s = SENT[a.sentiment] || SENT["중립"];
  const impCls = a.importance >= 3 ? "lvl3" : "";
  const metric = a.metric ? `<span class="metric">${esc(a.metric)}</span>` : "";
  const tags = (a.tags || []).map(t => `<span class="tag">#${esc(t)}</span>`).join("");
  const acts = (a.actions || []).map(x => `<li>${esc(x)}</li>`).join("");
  return `
  <article class="card" style="--accent:${s.v};--accent-bg:${s.b}">
    <div class="top">
      ${metric}
      <span class="sent">${esc(a.sentiment)}</span>
      <span class="imp ${impCls}"><span class="dot"></span>중요도 ${esc(a.importance_label)}</span>
    </div>
    <h2 class="headline">${esc(a.headline)}</h2>
    <div class="meta">
      <span class="corp">${esc(it.corp_name)}</span>
      ${it.stock_code ? `<span class="ticker">${esc(it.stock_code)}</span>` : ""}
    </div>
    <div class="report">${esc(it.report_nm)}</div>
    ${tags ? `<div class="tags">${tags}</div>` : ""}
    <div class="actions"><div class="actions-in"><ul>${acts}</ul></div></div>
    <div class="foot">
      <button class="toggle">후속 확인 <span class="car">▾</span></button>
      <a class="src" href="${esc(it.url)}" target="_blank" rel="noopener">원문 ↗</a>
    </div>
  </article>`;
}

function render() {
  const feed = document.getElementById("feed");
  const items = allItems.filter(it => (it.analysis?.importance || 0) >= minImp);
  const cnt = { "호재": 0, "악재": 0, "중립": 0 };
  items.forEach(it => cnt[it.analysis.sentiment] != null && cnt[it.analysis.sentiment]++);
  document.getElementById("cPos").textContent = cnt["호재"];
  document.getElementById("cNeg").textContent = cnt["악재"];
  document.getElementById("cNeu").textContent = cnt["중립"];
  if (!items.length) { feed.innerHTML = `<div class="state">해당 조건의 공시가 없습니다.</div>`; return; }
  feed.innerHTML = items.map(card).join("");
  feed.querySelectorAll(".toggle").forEach(btn => btn.addEventListener("click", () => {
    btn.closest(".card").querySelector(".actions").classList.toggle("open");
    btn.classList.toggle("open");
  }));
}

async function load() {
  const feed = document.getElementById("feed");
  try {
    const data = await (await fetch(FEED_URL)).json();
    allItems = data.items || [];
    const m = data.meta || {};
    const src = m.collector === "dart" ? "DART" : "샘플";
    const eng = m.analyzer === "llm" ? "AI 해석" : "룰 해석";
    document.getElementById("date").textContent =
      `${m.generated_at || ""} · ${src} · ${eng}`.replace(/^ · /, "");
    render();
  } catch (e) {
    feed.innerHTML = `<div class="state">불러오기 실패<br/>${esc(String(e))}</div>`;
  }
}

document.getElementById("filters").addEventListener("click", e => {
  const chip = e.target.closest(".chip"); if (!chip) return;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
  chip.classList.add("on");
  minImp = parseInt(chip.dataset.imp, 10);
  render();
});

load();
</script>
</body>
</html>
